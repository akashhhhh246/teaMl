version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: teaml-ml-service
    ports:
      - "8000:8000"
    environment:
      - ML_PORT=8000
      - ML_HOST=0.0.0.0
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teaml-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=teaml_super_secret_jwt_token_key_2026_enterprise_production
      - ML_SERVICE_URL=http://ml-service:8000/api/v1
      - CLIENT_URL=http://localhost:7000
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teaml-frontend
    ports:
      - "7000:80"
    depends_on:
      - backend
    restart: unless-stopped
